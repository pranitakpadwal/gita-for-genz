<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2560" width="1600" height="2560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241a10"/>
      <stop offset="55%" stop-color="#1a1109"/>
      <stop offset="100%" stop-color="#120b05"/>
    </linearGradient>
    <linearGradient id="bowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6ac5c"/>
      <stop offset="55%" stop-color="#c97a3a"/>
      <stop offset="100%" stop-color="#a8471f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e6ac5c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e6ac5c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="2560" fill="url(#bg)"/>

  <!-- faint chariot-wheel echo, bottom left -->
  <g opacity="0.07" stroke="#f6f1e7" fill="none" stroke-width="3">
    <circle cx="180" cy="2340" r="360"/>
    <circle cx="180" cy="2340" r="270"/>
    <g stroke-width="2.5">
      <line x1="180" y1="1980" x2="180" y2="2700" transform="rotate(0 180 2340)"/>
      <line x1="180" y1="1980" x2="180" y2="2700" transform="rotate(30 180 2340)"/>
      <line x1="180" y1="1980" x2="180" y2="2700" transform="rotate(60 180 2340)"/>
      <line x1="180" y1="1980" x2="180" y2="2700" transform="rotate(90 180 2340)"/>
      <line x1="180" y1="1980" x2="180" y2="2700" transform="rotate(120 180 2340)"/>
      <line x1="180" y1="1980" x2="180" y2="2700" transform="rotate(150 180 2340)"/>
    </g>
  </g>

  <!-- glow behind bow -->
  <circle cx="980" cy="780" r="520" fill="url(#glow)"/>

  <!-- the falling bow -->
  <g transform="translate(980,780) rotate(-28)">
    <!-- string -->
    <path d="M -60,-430 L 40,430" stroke="#f6f1e7" stroke-width="3" opacity="0.55"/>
    <!-- bow stave -->
    <path d="M -60,-430 C 260,-260 260,260 40,430" fill="none" stroke="url(#bowGrad)" stroke-width="16" stroke-linecap="round"/>
    <!-- grip wrap -->
    <path d="M -30,-30 L 20,45" stroke="#241a10" stroke-width="20" stroke-linecap="round" opacity="0.5"/>
    <!-- release / motion lines -->
    <g stroke="#e6ac5c" stroke-width="5" stroke-linecap="round" opacity="0.5">
      <line x1="-140" y1="-40" x2="-220" y2="-90"/>
      <line x1="-120" y1="20" x2="-205" y2="10"/>
      <line x1="-110" y1="80" x2="-190" y2="105"/>
    </g>
  </g>

  <!-- title block -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#f6f1e7">
    <text x="800" y="1620" font-size="128" font-weight="700" letter-spacing="2">KRISHNA</text>
    <text x="800" y="1750" font-size="128" font-weight="700" letter-spacing="2">TEXTS BACK</text>
  </g>

  <line x1="620" y1="1820" x2="980" y2="1820" stroke="#c97a3a" stroke-width="3"/>

  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#e6ac5c">
    <text x="800" y="1890" font-size="46" letter-spacing="6">18 FIGHTS YOU'RE ALREADY IN</text>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#cbbfa8">
    <text x="800" y="2420" font-size="38" letter-spacing="5">RUDRA PRASAD KASTURI</text>
  </g>
</svg>
